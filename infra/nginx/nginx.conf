events {
    worker_connections 1024;
}

http {
    # Define IP-based rate limiting zone: 10MB shared memory, 20 requests per second
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=20r/s;
    limit_req_status 429;

    # Upstream pool of Fastify API containers
    upstream api_backend {
        least_conn;
        server api:3000;
        keepalive 32;
    }

    server {
        listen 80;

        # Rate-limited checkout endpoint
        location /checkout {
            limit_req zone=ip_limit burst=40 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Naive checkout endpoint
        location /naive-checkout {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other endpoints (health, order polling, etc.)
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}